# ===== Camploop V1 - Application Configuration (Supabase-backed) =====

spring.application.name=camploop
server.port=8081

# ---- Supabase Postgres connection ----
# Find this under Supabase Dashboard -> Project Settings -> Database -> Connection string (URI),
# or use the pooled "Transaction" connection string for production.
# Example host: db.<your-project-ref>.supabase.co
spring.datasource.url=jdbc:postgresql://db.eprhgwmfquumkawqqcdm.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=CamploopJAVA
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# update = creates/updates tables automatically from the @Entity classes (fine for V1 dev).
# If you'd rather manage the schema yourself via the Supabase SQL editor (recommended once
# RLS policies are in place), switch this to "validate" and run the SQL in README.md instead.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Supabase's pooled connections don't support JDBC's default statement caching well
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ---- Supabase project settings ----
