<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Camploop</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo">camploop<span class="dot">.</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="marketplace.html">Marketplace</a></li>
    </ul>
    <div class="nav-actions"></div>
  </div>
</nav>

<div class="auth-shell grid-paper">
  <div class="auth-card">
    <h1>Welcome back 👋</h1>
    <p class="sub">Log in to buy, sell, and manage your listings.</p>
    <div id="login-alert"></div>
    <form id="login-form">
      <div class="field">
        <label>College Email</label>
        <input type="email" id="l-email" placeholder="you@college.edu" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="l-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <p class="form-note">New to Camploop? <a href="signup.html">Create an account</a></p>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('login-alert');
    const btn = e.target.querySelector('button[type="submit"]');
    alertBox.innerHTML = '';
    btn.disabled = true;
    try {
      await Auth.signIn(
        document.getElementById('l-email').value.trim(),
        document.getElementById('l-password').value
      );
      // Touch the backend once so the profiles row exists before we land elsewhere
      try { await Api.me(); } catch (e) {}
      const next = new URLSearchParams(window.location.search).get('next') || 'index.html';
      window.location.href = next;
    } catch (err) {
      alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
